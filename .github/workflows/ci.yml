name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Build and GameTests
    runs-on: ubuntu-latest
    timeout-minutes: 120

    env:
      EXPECTED_GAMETESTS: 179

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle cache
        uses: gradle/actions/setup-gradle@v6
        with:
          cache-provider: basic

      - name: Make Gradle wrapper executable
        run: chmod +x gradlew

      - name: Run checks
        run: ./gradlew check --no-daemon --console=plain --stacktrace

      - name: Run normal GameTests
        shell: bash
        run: |
          set -o pipefail
          rm -rf world logs
          mkdir -p build/ci
          ./gradlew runGameTestServer --no-daemon --console=plain 2>&1 \
            | tee build/ci/gametest-normal.log
          grep -Fq "All ${EXPECTED_GAMETESTS} required tests passed :)" \
            build/ci/gametest-normal.log

      - name: Run minimal-runtime GameTests
        shell: bash
        run: |
          set -o pipefail
          rm -rf world logs
          mkdir -p build/ci
          ./gradlew runGameTestServer -PshincolleMinimalRuntime=true \
            --no-daemon --console=plain 2>&1 \
            | tee build/ci/gametest-minimal.log
          grep -Fq "All ${EXPECTED_GAMETESTS} required tests passed :)" \
            build/ci/gametest-minimal.log

      - name: Run KubeJS GameTests
        shell: bash
        run: |
          set -o pipefail
          rm -rf build/kubejs-gametest/world build/kubejs-gametest/logs
          mkdir -p build/ci
          ./gradlew runKubeJSGameTestServer -PshincolleKubeJSRuntime=true \
            --no-daemon --console=plain 2>&1 \
            | tee build/ci/gametest-kubejs.log
          grep -Fq "All ${EXPECTED_GAMETESTS} required tests passed :)" \
            build/ci/gametest-kubejs.log

      - name: Upload reports and GameTest logs
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: ci-reports-${{ github.run_id }}
          path: |
            build/reports/
            build/ci/
            logs/
            build/kubejs-gametest/logs/
          if-no-files-found: ignore
          retention-days: 14
