name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Build and GameTests
    runs-on: ubuntu-latest
    timeout-minutes: 120

    env:
      EXPECTED_GAMETESTS: 180

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle cache
        uses: gradle/actions/setup-gradle@v6
        with:
          cache-provider: basic

      - name: Make Gradle wrapper executable
        run: chmod +x gradlew

      - name: Run checks
        run: ./gradlew check --no-daemon --console=plain --stacktrace

      - name: Run normal GameTests
        shell: bash
        run: |
          set -o pipefail
          rm -rf world logs
          mkdir -p build/ci
          ./gradlew runGameTestServer --no-daemon --console=plain 2>&1 \
            | tee build/ci/gametest-normal.log
          grep -Fq "All ${EXPECTED_GAMETESTS} required tests passed :)" \
            build/ci/gametest-normal.log

      - name: Run minimal-runtime GameTests
        shell: bash
        run: |
          set -o pipefail
          rm -rf world logs
          mkdir -p build/ci
          ./gradlew runGameTestServer -PshincolleMinimalRuntime=true \
            --no-daemon --console=plain 2>&1 \
            | tee build/ci/gametest-minimal.log
          grep -Fq "All ${EXPECTED_GAMETESTS} required tests passed :)" \
            build/ci/gametest-minimal.log

      - name: Run KubeJS GameTests
        shell: bash
        run: |
          set -o pipefail
          rm -rf build/kubejs-gametest/world build/kubejs-gametest/logs
          mkdir -p build/ci
          ./gradlew runKubeJSGameTestServer -PshincolleKubeJSRuntime=true \
            --no-daemon --console=plain 2>&1 \
            | tee build/ci/gametest-kubejs.log
          grep -Fq "All ${EXPECTED_GAMETESTS} required tests passed :)" \
            build/ci/gametest-kubejs.log

      - name: Run GameTests without Curios
        shell: bash
        run: |
          set -o pipefail
          rm -rf world logs
          mkdir -p build/ci
          ./gradlew runGameTestServer -PshincolleCuriosRuntime=false \
            --no-daemon --console=plain 2>&1 \
            | tee build/ci/gametest-no-curios.log
          grep -Fq "All ${EXPECTED_GAMETESTS} required tests passed :)" \
            build/ci/gametest-no-curios.log

      - name: Run GameTests without Tinkers
        shell: bash
        run: |
          set -o pipefail
          rm -rf world logs
          mkdir -p build/ci
          ./gradlew runGameTestServer -PshincolleTinkersRuntime=false \
            --no-daemon --console=plain 2>&1 \
            | tee build/ci/gametest-no-tinkers.log
          grep -Fq "All ${EXPECTED_GAMETESTS} required tests passed :)" \
            build/ci/gametest-no-tinkers.log

      - name: Upload the built mod jar
        if: success()
        uses: actions/upload-artifact@v7
        with:
          # check already runs jar, addMixinsToJar and reobfJar, so the distributable
          # is built on every run and was simply being thrown away. Keeping it lets a
          # reviewer install the jar from a PR without building it themselves.
          name: shincolle-kai-${{ github.run_id }}
          path: build/libs/*.jar
          if-no-files-found: error
          retention-days: 14

      - name: Upload reports and GameTest logs
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: ci-reports-${{ github.run_id }}
          path: |
            build/reports/
            build/ci/
            logs/
            build/kubejs-gametest/logs/
          if-no-files-found: ignore
          retention-days: 14
