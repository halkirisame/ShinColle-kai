tasks.register('testAiCoreBoundary') {
    description = 'Checks rejected dependencies and accepted Java literals in the ship AI boundary validator.'
    doLast {
        def cases = [
                spacedType: [source: 'class Probe { net . minecraft . world . entity . Entity value; }', forbidden: true],
                textBlock: [source: 'class Probe { String text = """\n    a " net.minecraft.world.entity.Entity\n    """; }', forbidden: false],
                ordinaryType: [source: 'class Probe { net.minecraft.world.entity.Entity value; }', forbidden: true],
                nestedType: [source: 'class Probe { net . minecraft . world . entity . Entity . RemovalReason value; }', forbidden: true],
                commentedType: [source: 'class Probe { net /* comment */ . minecraft . world . entity . Entity value; }', forbidden: true],
                ordinaryImport: [source: 'import net.minecraft.world.entity.Entity; class Probe {}', forbidden: true],
                spacedImport: [source: 'import net . minecraft . world . entity . Entity; class Probe {}', forbidden: true],
                commentedImport: [source: 'import net /* comment */ . minecraft . world . entity . Entity; class Probe {}', forbidden: true],
                wildcardImport: [source: 'import net . minecraft . world . entity . *; class Probe {}', forbidden: true],
                staticImport: [source: 'import static net . minecraft . world . entity . Entity . *; class Probe {}', forbidden: true],
                nestedImport: [source: 'import net.minecraft.world.entity.Entity.RemovalReason; class Probe {}', forbidden: true],
                otherApi: [source: 'import com.lulan.shincolle.api.target.TargetCategory; class Probe {}', forbidden: true],
                traitLookalike: [source: 'import com.lulan.shincolle.api.target.TargetTraitOther; class Probe {}', forbidden: true],
                apiWildcard: [source: 'import com.lulan.shincolle.api.target.*; class Probe {}', forbidden: true],
                javaImport: [source: 'import java . util . List; class Probe {}', forbidden: false],
                javaWildcard: [source: 'import java.util.*; class Probe {}', forbidden: false],
                javaStatic: [source: 'import static java.lang.Math.*; class Probe {}', forbidden: false],
                javaNested: [source: 'class Probe { java . util . Map . Entry value; }', forbidden: false],
                domainImport: [source: 'import com.lulan.shincolle.ai.domain.TargetHandle; class Probe {}', forbidden: false],
                traitImport: [source: 'import com.lulan.shincolle.api.target.TargetTrait; class Probe {}', forbidden: false],
                traitStatic: [source: 'import static com.lulan.shincolle.api.target.TargetTrait.SHIP; class Probe {}', forbidden: false],
                traitWildcard: [source: 'import static com.lulan.shincolle.api.target.TargetTrait.*; class Probe {}', forbidden: false],
                traitMember: [source: 'class Probe { Object value = com . lulan . shincolle . api . target . TargetTrait . SHIP; }', forbidden: false],
                comments: [source: '// net.minecraft.world.entity.Entity\n/* import net.minecraft.world.entity.Entity; */ class Probe {}', forbidden: false],
                stringLiteral: [source: 'class Probe { String text = "net.minecraft.world.entity.Entity"; }', forbidden: false],
                escapedString: [source: 'class Probe { String text = "\\\"net.minecraft.world.entity.Entity\\\""; }', forbidden: false],
                characterLiteral: [source: "class Probe { char quote = '\"'; }", forbidden: false],
                textBlockComment: [source: 'class Probe { String text = """\n/* import net.minecraft.world.entity.Entity; */\n    """; }', forbidden: false],
                unicodeImport: [source: 'import n\\u0065t.minecraft.world.entity.Entity; class Probe {}', forbidden: true],
                unicodeJavaImport: [source: 'import j\\u0061va.util.List; class Probe {}', forbidden: false],
                instanceCall: [source: 'class Probe { Object value = object.getValue(); }', forbidden: false]
        ]
        def failures = []
        cases.each { name, sample ->
            def references = AiCoreBoundaryValidator.forbiddenReferences(sample.source, 'Probe.java')
            if ((!references.isEmpty()) != sample.forbidden) {
                failures << "${name}: expected forbidden=${sample.forbidden}, found ${references}"
            }
        }
        if (!failures.isEmpty()) throw new GradleException("Ship AI boundary regressions:\n" + failures.join('\n'))
        logger.lifecycle("Ship AI boundary regression cases passed: ${cases.size()}")
    }
}

tasks.named('check').configure { dependsOn tasks.named('testAiCoreBoundary') }

class AiCoreBoundaryValidator {
    static boolean allowedReference(String reference) {
        return reference.startsWith('java.') || reference.startsWith('com.lulan.shincolle.ai.domain.') ||
                reference == 'com.lulan.shincolle.api.target.TargetTrait' ||
                reference.startsWith('com.lulan.shincolle.api.target.TargetTrait.')
    }

    static String qualifiedName(com.sun.source.tree.Tree tree) {
        if (tree instanceof com.sun.source.tree.IdentifierTree) return tree.name.toString()
        if (tree instanceof com.sun.source.tree.MemberSelectTree) {
            String prefix = qualifiedName(tree.expression)
            return prefix == null ? null : prefix + '.' + tree.identifier
        }
        return null
    }

    static List<String> forbiddenReferences(String input, String filename) {
        def compiler = javax.tools.ToolProvider.systemJavaCompiler
        if (compiler == null) throw new GradleException('Ship AI boundary validation requires a JDK with a Java compiler.')
        def diagnostics = new javax.tools.DiagnosticCollector<javax.tools.JavaFileObject>()
        def manager = compiler.getStandardFileManager(diagnostics, java.util.Locale.ROOT, java.nio.charset.StandardCharsets.UTF_8)
        def source = new javax.tools.SimpleJavaFileObject(java.net.URI.create('string:///' + filename),
                javax.tools.JavaFileObject.Kind.SOURCE) {
            @Override
            CharSequence getCharContent(boolean ignoreEncodingErrors) { return input }
        }
        def references = new LinkedHashSet<String>()
        def scanner = new com.sun.source.util.TreeScanner<Void, Void>() {
            @Override
            Void visitImport(com.sun.source.tree.ImportTree tree, Void unused) {
                references.add(AiCoreBoundaryValidator.qualifiedName(tree.qualifiedIdentifier))
                return null
            }

            @Override
            Void visitMemberSelect(com.sun.source.tree.MemberSelectTree tree, Void unused) {
                String reference = AiCoreBoundaryValidator.qualifiedName(tree)
                // Only package-qualified type/member chains; instance expressions are not dependencies.
                if (reference != null && reference ==~ /(?:[a-z_][\w$]*\.)+[A-Z_$][\w$]*(?:\.[\w$]+)*/) {
                    references.add(reference)
                }
                return super.visitMemberSelect(tree, unused)
            }
        }
        try {
            def task = (com.sun.source.util.JavacTask) compiler.getTask(null, manager, diagnostics,
                    ['--release', '17', '-proc:none'], null, [source])
            task.parse().each { unit -> scanner.scan(unit, null) }
            def errors = diagnostics.diagnostics.findAll { it.kind == javax.tools.Diagnostic.Kind.ERROR }
            if (!errors.isEmpty()) {
                throw new GradleException("Cannot parse ship AI core source ${filename}: ${errors}")
            }
        } finally {
            manager.close()
        }
        return references.findAll { !allowedReference(it) } as List<String>
    }
}
