apply plugin: 'checkstyle'

checkstyle {
    toolVersion = '10.18.1'
    configFile = file('config/checkstyle/checkstyle.xml')

    // Cap warnings at what is already there so the count can fall but not rise.
    // Errors still fail on the first one; this only governs the "warning" severity
    // rules, which today means AvoidStarImport and nothing else.
