<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="700" viewBox="0 0 1000 700">
  <style>
    .node { fill:#f8f9fa; stroke:#2b2b2b; stroke-width:1.2 }
    .text { font-family:Segoe UI, Arial, sans-serif; font-size:13px; fill:#111 }
    .title { font-size:16px; font-weight:700 }
  </style>
  <rect width="100%" height="100%" fill="#ffffff"/>
  <text x="24" y="36" class="text title">Target Selection Flowchart (simplified)</text>

  <!-- Nodes -->
  <g>
    <rect x="40" y="80" width="260" height="40" rx="6" class="node"/>
    <text x="60" y="105" class="text">Preconditions: host valid, not sitting, tick %8 == 0</text>

    <rect x="40" y="150" width="260" height="40" rx="6" class="node"/>
    <text x="60" y="175" class="text">Flag checks: AntiAir → AntiSS → PVPFirst</text>

    <rect x="40" y="220" width="260" height="40" rx="6" class="node"/>
    <text x="60" y="245" class="text">Search by type (interfaces/classes) within AABB</text>

    <rect x="40" y="290" width="260" height="40" rx="6" class="node"/>
    <text x="60" y="315" class="text">Filter: TargetHelper.Selector (ally/invisible/unattackable)</text>

    <rect x="40" y="360" width="260" height="40" rx="6" class="node"/>
    <text x="60" y="385" class="text">Sort by distance & pick nearest (or random among top 3)</text>

    <rect x="40" y="430" width="260" height="40" rx="6" class="node"/>
    <text x="60" y="455" class="text">Set target: host.setEntityTarget(target)</text>
  </g>

  <!-- Arrows -->
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="7" refX="10" refY="3.5" orient="auto">
      <path d="M0,0 L10,3.5 L0,7 z" fill="#2b2b2b" />
    </marker>
  </defs>
  <line x1="170" y1="120" x2="170" y2="150" stroke="#2b2b2b" stroke-width="1.2" marker-end="url(#arrow)"/>
  <line x1="170" y1="190" x2="170" y2="220" stroke="#2b2b2b" stroke-width="1.2" marker-end="url(#arrow)"/>
  <line x1="170" y1="260" x2="170" y2="290" stroke="#2b2b2b" stroke-width="1.2" marker-end="url(#arrow)"/>
  <line x1="170" y1="330" x2="170" y2="360" stroke="#2b2b2b" stroke-width="1.2" marker-end="url(#arrow)"/>
  <line x1="170" y1="400" x2="170" y2="430" stroke="#2b2b2b" stroke-width="1.2" marker-end="url(#arrow)"/>

  <!-- Footer note -->
  <text x="24" y="680" class="text">Generated: simplified SVG for repository documentation. For high-fidelity diagrams, render Mermaid with mermaid-cli.</text>

</svg>
