modLoader = "javafml"
loaderVersion = "${loader_version_range}"
license = "${mod_license}"
issueTrackerURL = "https://github.com/halkirisame/ShinColle-kai/issues"

[[mods]]
modId = "${mod_id}"
version = "${mod_version}"
displayName = "ShinColle-kai"
authors = "${mod_authors}"
description = '''${mod_description}'''

[[dependencies.${ mod_id }]]
modId = "forge"
mandatory = true
versionRange = "${forge_version_range}"
ordering = "NONE"
side = "BOTH"

[[dependencies.${ mod_id }]]
modId = "minecraft"
mandatory = true
versionRange = "${minecraft_version_range}"
ordering = "NONE"
side = "BOTH"

[[dependencies.${ mod_id }]]
modId = "curios"
mandatory = false
versionRange = "[5.0.0,)"
ordering = "AFTER"
side = "BOTH"

[[dependencies.${ mod_id }]]
modId = "tconstruct"
mandatory = false
versionRange = "[3.7.0,)"
ordering = "AFTER"
side = "BOTH"
